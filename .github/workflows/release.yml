name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --workspace=packages/shared

      - name: Run tests
        run: npm run test

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --workspace=packages/shared

      - name: Stabilize 7zip helper path
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'node_modules\7zip-bin\win\x64\7za.exe'
          if (!(Test-Path $source)) {
            throw "Bundled 7za.exe is missing before packaging: $source"
          }

          $stableDir = Join-Path $env:RUNNER_TEMP '7zip-bin\win\x64'
          New-Item -ItemType Directory -Force -Path $stableDir | Out-Null
          $stablePath = Join-Path $stableDir '7za.exe'
          Copy-Item $source $stablePath -Force

          $indexPath = Join-Path $env:GITHUB_WORKSPACE 'node_modules\7zip-bin\index.js'
          @"
"use strict"

const path = require("path")

function getPath() {
  if (process.env.EXPENSES_7ZA_PATH) {
    return process.env.EXPENSES_7ZA_PATH
  }

  if (process.env.USE_SYSTEM_7ZA === "true") {
    return "7za"
  }

  if (process.platform === "darwin") {
    return path.join(__dirname, "mac", process.arch, "7za")
  }
  else if (process.platform === "win32") {
    return path.join(__dirname, "win", process.arch, "7za.exe")
  }
  else {
    return path.join(__dirname, "linux", process.arch, "7za")
  }
}

exports.path7za = getPath()
exports.path7x = path.join(__dirname, "7x.sh")
"@ | Set-Content -Path $indexPath -Encoding UTF8

          "EXPENSES_7ZA_PATH=$stablePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - id: check-win-cert
        shell: pwsh
        run: |
          if ($env:CSC_FILE_BASE64) { echo "has_cert=true" >> $env:GITHUB_OUTPUT }
        env:
          CSC_FILE_BASE64: ${{ secrets.CSC_FILE_BASE64 }}

      - name: Decode signing certificate
        if: steps.check-win-cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes(
            [System.IO.Path]::Combine($env:RUNNER_TEMP, 'cert.pfx'),
            [System.Convert]::FromBase64String($env:CSC_FILE_BASE64)
          )
        env:
          CSC_FILE_BASE64: ${{ secrets.CSC_FILE_BASE64 }}

      - name: Build desktop app
        working-directory: packages/desktop
        run: npx vite build

      - name: Build and publish
        working-directory: packages/desktop
        run: npx electron-builder --publish=always --config.electronVersion=35.7.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPENSES_7ZA_PATH: ${{ env.EXPENSES_7ZA_PATH }}
          CSC_FILE: ${{ steps.check-win-cert.outputs.has_cert == 'true' && format('{0}/cert.pfx', runner.temp) || '' }}
          CSC_PASSWORD: ${{ secrets.CSC_PASSWORD }}

  build-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --workspace=packages/shared

      - id: check-mac-cert
        run: |
          if [ -n "$MACOS_CERT_BASE64" ]; then echo "has_cert=true" >> $GITHUB_OUTPUT; fi
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}

      - name: Import signing certificate
        if: steps.check-mac-cert.outputs.has_cert == 'true'
        run: |
          echo "$MACOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions actions.keychain
          security set-default-keychain actions.keychain
          security unlock-keychain -p actions actions.keychain
          security import "$RUNNER_TEMP/cert.p12" -k actions.keychain \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild \
            -P "$MACOS_CERT_PASSWORD"
          security set-partition-list -i "codesigning:actions" -k actions actions.keychain
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build desktop app
        working-directory: packages/desktop
        run: npx vite build

      - name: Build and publish
        working-directory: packages/desktop
        run: npx electron-builder --publish=always --config.electronVersion=35.7.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}