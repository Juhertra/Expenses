name: Build & Release

on:
  push:
    tags:
      - 'v*'

# electron-builder needs write access to create Releases and upload assets.
permissions:
  contents: write

jobs:
  # Run tests before any builds. If tests fail, builds never start.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm run test

  # Produces: Expenses-setup-<version>.exe  +  latest.yml (update manifest)
  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # --- Code signing (optional) ---
      # Store a base64-encoded .pfx certificate in the CSC_FILE_BASE64 secret.
      # If the secret is not set the build publishes unsigned.
      # Note: secrets context is not available in if: expressions — use an
      # env-based check step to gate the signing steps instead.
      - id: check-win-cert
        shell: pwsh
        run: |
          if ($env:CSC_FILE_BASE64) { echo "has_cert=true" >> $env:GITHUB_OUTPUT }
        env:
          CSC_FILE_BASE64: ${{ secrets.CSC_FILE_BASE64 }}

      - name: Decode signing certificate
        if: steps.check-win-cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes(
            [System.IO.Path]::Combine($env:RUNNER_TEMP, 'cert.pfx'),
            [System.Convert]::FromBase64String($env:CSC_FILE_BASE64)
          )
        env:
          CSC_FILE_BASE64: ${{ secrets.CSC_FILE_BASE64 }}

      - run: npx vite build

      - name: Build and publish
        run: npx electron-builder --publish=always
        env:
          # electron-builder checks GH_TOKEN before GITHUB_TOKEN; map explicitly
          # so publishing works regardless of electron-builder version.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty string when secret is absent → electron-builder skips signing.
          CSC_FILE: ${{ steps.check-win-cert.outputs.has_cert == 'true' && format('{0}/cert.pfx', runner.temp) || '' }}
          CSC_PASSWORD: ${{ secrets.CSC_PASSWORD }}

  # Produces: Expenses-<version>-macOS.dmg  +  latest-mac.yml (update manifest)
  build-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # --- Code signing & notarization (optional) ---
      # Store a base64-encoded Developer ID .p12 in MACOS_CERT_BASE64.
      # If not set the .dmg is unsigned — macOS Gatekeeper will block it on
      # install.  Sign before shipping to end users.
      # Same secrets-in-if workaround as the Windows job.
      - id: check-mac-cert
        run: |
          if [ -n "$MACOS_CERT_BASE64" ]; then echo "has_cert=true" >> $GITHUB_OUTPUT; fi
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}

      - name: Import signing certificate
        if: steps.check-mac-cert.outputs.has_cert == 'true'
        run: |
          echo "$MACOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions actions.keychain
          security set-default-keychain actions.keychain
          security unlock-keychain -p actions actions.keychain
          security import "$RUNNER_TEMP/cert.p12" -k actions.keychain \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild \
            -P "$MACOS_CERT_PASSWORD"
          security set-partition-list -i "codesigning:actions" -k actions actions.keychain
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - run: npx vite build

      - name: Build and publish
        run: npx electron-builder --publish=always
        env:
          # Same GH_TOKEN mapping as the Windows job — see comment there.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing: electron-builder auto-discovers the Developer ID from the
          # keychain (imported above).  CSC_LINK is a Windows-only concept and
          # does not apply here.  Notarization uses APPLE_ID + APPLE_PASSWORD.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
